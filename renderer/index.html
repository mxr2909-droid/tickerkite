<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
<title>Tickerkite</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="calendar.css">
<link rel="stylesheet" href="markets.css">
<link rel="stylesheet" href="fed.css">
<link rel="stylesheet" href="graphs.css">
<link rel="stylesheet" href="board.css">
<link rel="stylesheet" href="brief.css">
<link rel="stylesheet" href="portfolio.css">
<link rel="stylesheet" href="curve.css">
<link rel="stylesheet" href="factor.css">
<link rel="stylesheet" href="warn.css">
<link rel="stylesheet" href="screen.css">
<link rel="stylesheet" href="companypage.css">
<link rel="stylesheet" href="command.css">
<link rel="stylesheet" href="settings.css">
<link rel="stylesheet" href="terminal.css">
<script src="theme.js"></script>
</head>
<body>
<div class="app" id="app" data-page="news">
  <nav class="side" aria-label="App sections">
    <div class="drag"></div>
    <div class="smon news-only">
    <div class="sgroup">Monitor</div>
    <button class="sitem" type="button" data-view="high"><span class="ic">◉</span>High Impact<span class="c" id="cHigh">0</span></button>
    <button class="sitem" type="button" data-view="all" aria-current="true"><span class="ic">▤</span>All News<span class="c" id="cAll">0</span></button>
    <button class="sitem" type="button" data-view="new"><span class="ic">✦</span>Last Hour<span class="c" id="cNew">0</span></button>
    <button class="sitem" type="button" data-view="watch"><span class="ic">★</span>Watchlist<span class="c" id="cWatch">0</span></button>
    </div>
    <div class="sgroup">Watchlist </div>
    <div class="quotes num" id="watchq"></div>
    <form class="wadd" id="wform" autocomplete="off">
      <input id="wadd" placeholder="+ Add ticker" aria-label="Add a ticker to your watchlist" spellcheck="false" maxlength="15">
    </form>
    <div class="werr" id="werr" role="status" aria-live="polite"></div>
    <div class="sgroup">Markets <span class="delay">click for chart</span></div>
    <div class="quotes num" id="quotes"></div>
    <div class="sgroup">Feeds</div>
    <div class="feeds" id="feeds" title="Edit sources in View › Edit Feeds…"></div>
  </nav>

  <section class="main" aria-label="Headlines">
    <div class="titlebar">
      <div class="pages" id="pages" role="tablist" aria-label="Pages">
        <button type="button" role="tab" data-p="brief" aria-selected="false" title="Brief (⌘⌥0)">Brief</button>
        <button type="button" role="tab" data-p="news" aria-selected="true" title="News (⌘⌥1)">News</button>
        <button type="button" role="tab" data-p="portfolio" aria-selected="false" title="Portfolio (⌘⌥7)">Portfolio</button>
        <div class="pgrp" data-g="Markets">
          <button type="button" class="gbtn" aria-haspopup="menu" aria-expanded="false"><span>Markets</span><i>▾</i></button>
          <div class="gmenu" role="menu" hidden>
            <button type="button" role="menuitemradio" data-p="markets" aria-selected="false">Markets<kbd>⌘⌥4</kbd></button>
            <button type="button" role="menuitemradio" data-p="curve" aria-selected="false">Yield curve<kbd>⌘⌥8</kbd></button>
            <button type="button" role="menuitemradio" data-p="fed" aria-selected="false">Fed path<kbd>⌘⌥5</kbd></button>
            <button type="button" role="menuitemradio" data-p="graphs" aria-selected="false">Graphs<kbd>⌘⌥6</kbd></button>
            <button type="button" role="menuitemradio" data-p="factor" aria-selected="false">Factor probabilities<kbd>⌘⌥R</kbd></button>
          </div>
        </div>
        <div class="pgrp" data-g="Macro">
          <button type="button" class="gbtn" aria-haspopup="menu" aria-expanded="false"><span>Macro</span><i>▾</i></button>
          <div class="gmenu" role="menu" hidden>
            <button type="button" role="menuitemradio" data-p="score" aria-selected="false">Scorecards<kbd>⌘⌥2</kbd></button>
            <button type="button" role="menuitemradio" data-p="calendar" aria-selected="false">Calendar<kbd>⌘⌥3</kbd></button>
            <button type="button" role="menuitemradio" data-p="warn" aria-selected="false">Warning history<kbd>⌘⌥W</kbd></button>
          </div>
        </div>
        <button type="button" role="tab" data-p="screen" aria-selected="false" title="Stock screener (⌘⌥S)">Screener</button>
        <button type="button" role="tab" data-p="company" aria-selected="false" title="Company (⌘⌥9) · ⌘K to look one up">Company</button>
      </div>
      <div class="tabs news-only" id="tabs"><span class="pg"><span id="pgView">All</span><b>News</b></span></div>
      <div class="tabs score-only" id="atabs"></div>
    </div>
    <div class="search score-only" id="sbar">
      <span class="sinfo" id="sinfo">Scores 0–100: higher = more constructive over the next 6–12 months</span>
      <button type="button" class="sref" id="sref" title="Download the latest economic data">⟳ Update data</button>
    </div>
    <form class="search news-only" id="sform" autocomplete="off">
      <input id="q" placeholder="Search headlines, tickers, sources…   /" aria-label="Search headlines">
      <label class="opt">▤ <select id="src" aria-label="Source"><option value="">Sources</option></select></label>
      <label class="opt">▦ <select id="win" aria-label="Time window"><option value="6">6H</option><option value="24" selected>24H</option><option value="72">72H</option></select></label>
    </form>
    <div class="list num score-only" id="score" aria-label="Scorecard"></div>
    <div class="list num calendar-only" id="calendar" aria-label="Economic calendar"></div>
    <div class="list num markets-only" id="markets" aria-label="Market heatmap"></div>
    <div class="list num fed-only" id="fed" aria-label="Fed path"></div>
    <div class="list num graphs-only" id="graphs" aria-label="Graph workspace"></div>
    <div class="list num brief-only" id="brief" aria-label="Brief"></div>
    <div class="list num portfolio-only" id="portfolio" aria-label="Portfolio"></div>
    <div class="list num curve-only" id="curve" aria-label="Yield curve"></div>
    <div class="list num factor-only" id="factor" aria-label="Factor probabilities"></div>
    <div class="list num warn-only" id="warn" aria-label="Warning history"></div>
    <div class="list num screen-only" id="screen" aria-label="Stock screener"></div>
    <div class="list num company-only" id="company" aria-label="Company"></div>
    <div class="secbar news-only">
      <div class="l"><b>Top Ranked News</b><span>|</span><em id="more">More »</em></div>
      <div class="toggle" id="mode">
        <button type="button" data-m="news" aria-pressed="true">Top News</button>
        <button type="button" data-m="ctx" aria-pressed="false">Background &amp; Opinion</button>
      </div>
    </div>
    <div class="list num news-only" id="list" role="listbox" aria-label="Headlines"></div>
    <div class="status num">
      <span><b id="sHigh">0</b> <span class="dim">high-impact</span></span>
      <span><b id="sShown">0</b> <span class="dim">shown</span></span>
      <span><b id="sSrc">0</b> <span class="dim">outlets</span></span>
      <button type="button" class="refresh" id="refresh" title="Refresh (⌘R)">⟳ Refresh</button>
      <button type="button" class="refresh" id="widgetBtn" title="Floating widget (⌘⇧W)">▣ Widget</button>
      <span class="r" id="pulled">Loading…</span>
    </div>
  </section>

  <aside class="detail news-only" id="detail" aria-label="Story"></aside>
  <aside class="detail score-only" id="sdetail" aria-label="Indicator"></aside>
  <aside class="detail calendar-only" id="cdetail" aria-label="Economic calendar detail"></aside>
  <aside class="detail markets-only" id="mdetail" aria-label="Market heatmap detail"></aside>
  <aside class="detail fed-only" id="fdetail" aria-label="Fed path detail"></aside>
  <aside class="detail graphs-only" id="gdetail" aria-label="Graph workspace detail"></aside>
  <aside class="detail brief-only" id="bdetail" aria-label="Today"></aside>
  <aside class="detail portfolio-only" id="pdetail" aria-label="Holding detail"></aside>
  <aside class="detail curve-only" id="ydetail" aria-label="Yield curve detail"></aside>
  <aside class="detail factor-only" id="fadetail" aria-label="Factor probabilities detail"></aside>
  <aside class="detail warn-only" id="wndetail" aria-label="Warning history detail"></aside>
  <aside class="detail screen-only" id="scdetail" aria-label="Screener detail"></aside>
  <aside class="detail company-only" id="codetail" aria-label="Company detail"></aside>
</div>
<script src="ui.js"></script>
<script src="company.js"></script>
<script src="instrument.js"></script>
<script src="../src/macro/board.js"></script>
<script src="board.js"></script>
<script src="scorecard.js"></script>
<script src="calendar.js"></script>
<script src="markets.js"></script>
<script src="fed.js"></script>
<script src="graphs.js"></script>
<script src="brief.js"></script>
<script src="portfolio.js"></script>
<script src="curve.js"></script>
<script src="factor.js"></script>
<script src="warn.js"></script>
<script src="screen.js"></script>
<script src="companypage.js"></script>
<script src="command.js"></script>
<script src="chrome.js"></script>
<script src="app.js"></script>
<script src="settings.js"></script>
</body>
</html>
