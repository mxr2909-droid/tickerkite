<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
<title>Tickerkite Widget</title>
<link rel="stylesheet" href="widget.css">
</head>
<body>
<div class="w">
  <header class="bar">
    <span class="brand">Tickerkite</span>
    <div class="seg" id="seg" role="tablist" aria-label="List">
      <button type="button" role="tab" data-v="top" aria-selected="true">Top</button>
      <button type="button" role="tab" data-v="latest" aria-selected="false">Latest</button>
    </div>
    <div class="ctl">
      <button type="button" id="pin" class="pin" title="Pin above other windows" aria-pressed="false">Pin</button>
      <button type="button" id="app" title="Open Tickerkite">↗</button>
      <button type="button" id="close" title="Close widget (⌘⇧W)">×</button>
    </div>
  </header>
  <div class="quotes num" id="quotes"></div>
  <ol class="list" id="list"></ol>
  <footer class="foot num">
    <span><b id="fHigh">0</b> high/span>
    <span><b id="fAll">0</b> stories</span>
    <button type="button" id="refresh" title="Refresh now">⟳</button>
    <span class="r" id="pulled">Loading…</span>
  </footer>
</div>
<script src="widget.js"></script>
</body>
</html>
